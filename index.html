<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2f7" />
  <title>Kriptogram — Türkçe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <p class="credit" aria-label="Geliştirici">Murat Adıyaman</p>

  <div class="app">
    <section id="screenMenu" class="screen menu-screen">
      <div class="menu-card">
        <div class="menu-logo">◇</div>
        <h1 class="menu-title">Kriptogram</h1>
        <p class="menu-sub">Türkçe atasözleri, deyimler ve unutulmaz sözler</p>
        <label class="menu-label" for="difficulty">Zorluk</label>
        <select id="difficulty" class="menu-select" aria-label="Zorluk seviyesi">
          <option value="easy">Kolay</option>
          <option value="medium" selected>Orta</option>
          <option value="hard">Zor</option>
        </select>
        <button type="button" class="btn btn-play" id="btnPlay">Oyna</button>
        <button type="button" class="btn-howto" id="btnHowto" aria-label="Nasıl oynanır">Nasıl oynanır? 📖</button>
      </div>
    </section>

    <section id="screenGame" class="screen game-screen is-hidden" aria-hidden="true">
      <header class="top-bar">
        <button type="button" class="icon-btn" id="btnHome" aria-label="Ana menü">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
        </button>
        <div class="mistakes" id="mistakesRow" role="status" aria-live="polite">
          <span class="mistakes-label">Hata</span>
          <span class="mistake-dots" id="mistakeDots"></span>
        </div>
        <button type="button" class="icon-btn" id="btnSettings" aria-label="Ayarlar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </header>

      <div class="game-scroll">
        <div class="meta" id="meta"></div>
        <div class="legend-strip" id="legend" aria-label="Sayı haritası"></div>
        <div class="board" id="board" role="group" aria-label="Bulmaca"></div>
        <p class="hint-text" id="hintMsg"></p>
      </div>

      <div class="action-bar">
        <button type="button" class="pill-btn pill-hint" id="btnHint">
          <span class="pill-icon" aria-hidden="true">💡</span>
          <span>Harf ipucu</span>
        </button>
        <button type="button" class="pill-btn pill-check" id="btnCheck">Kontrol</button>
      </div>

      <div class="vkeyboard" id="vkeyboard" role="group" aria-label="Ekran klavyesi"></div>
    </section>
  </div>

  <div id="backdrop" class="backdrop is-hidden" aria-hidden="true"></div>
  <div id="panelSettings" class="sheet is-hidden" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
    <h2 id="settingsTitle" class="sheet-title">Ayarlar</h2>
    <label class="sheet-label" for="difficultySheet">Zorluk</label>
    <select id="difficultySheet" class="sheet-select"></select>
    <button type="button" class="btn btn-block" id="btnNewGame">Yeni bulmaca</button>
    <button type="button" class="btn btn-block btn-ghost-sheet" id="btnCloseSettings">Kapat</button>
    <button type="button" class="btn btn-block btn-ghost-sheet" id="btnShowIntro">Tanıtımı tekrar göster</button>
  </div>

  <div id="introOverlay" class="intro-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="introTitle" aria-hidden="true">
    <div class="intro-shell">
      <button type="button" class="intro-skip" id="introSkip">Atla</button>
      <div class="intro-emoji" id="introEmoji" aria-hidden="true">🔓</div>
      <h2 class="intro-title" id="introTitle">Kriptogram</h2>
      <p class="intro-text" id="introText"></p>
      <div class="intro-dots" id="introDots" role="tablist" aria-label="Slayt"></div>
      <div class="intro-nav">
        <button type="button" class="intro-btn intro-btn-ghost" id="introPrev">Geri</button>
        <button type="button" class="intro-btn intro-btn-main" id="introNext">İleri</button>
      </div>
    </div>
  </div>

  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
